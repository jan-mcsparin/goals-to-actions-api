[project]
name = "goals-to-actions-api"
version = "0.1.0"
description = "API for Goals to Actions: FastAPI on Postgres"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.7",
    "pydantic>=2.14.3",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
